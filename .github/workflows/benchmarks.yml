name: Authoring eval oracle tests
run-name: ${{ github.actor || 'unknown' }} is running ${{ github.workflow || 'workflow' }} on ${{ github.repository || 'repo' }}
# tests_ce/nightly_tests/test_benchmarks tests the blind-agent eval oracle (benchmarks/authoring_eval), not product code.
# It runs nightly and by hand; main.yml also covers it in the non-PR unit shard.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  # development finishes a started run so its result (and the README badge) always comes from a complete run
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/development' }}

permissions:
  contents: read

env:
  RUNTIME_ENVIRONMENT: production

jobs:
  benchmarks_oracle:
    name: Authoring eval oracle tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv sync --python 3.11
      - name: Run oracle tests
        run: uv run pytest tests_ce/nightly_tests/test_benchmarks -n auto -q --durations=10
