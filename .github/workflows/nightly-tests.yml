name: Nightly authoring matrices
# Coverage for these cases is collected by the non-PR shards in main.yml.
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            args: tests_ce/nightly_tests/unit
          - shard: integration
            args: tests_ce/nightly_tests/integration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --python 3.11
      - name: Run ${{ matrix.shard }} matrix
        run: uv run pytest -q -n 0 ${{ matrix.args }} --durations=20
