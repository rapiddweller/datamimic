name: Publish development architecture

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Github Datamimic CE CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: architecture-pages
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'development' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      available: ${{ steps.evidence.outputs.available }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v5
        with:
          ref: development

      - name: Download this attempt's report data
        id: evidence
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          latest=$(gh api "repos/$REPOSITORY/actions/workflows/main.yml/runs?branch=development&status=completed&per_page=100" \
            --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | first | "\(.id)/\(.run_attempt)"')
          [[ "$latest" =~ ^[0-9]+/[0-9]+$ ]] || { echo "Cannot identify the latest development run" >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            SOURCE_RUN="${latest%/*}"
            SOURCE_ATTEMPT="${latest#*/}"
          fi
          if [[ "$latest" != "$SOURCE_RUN/$SOURCE_ATTEMPT" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipped superseded development run $SOURCE_RUN/$SOURCE_ATTEMPT; latest is $latest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          artifact=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --paginate \
            --jq ".artifacts[] | select(.name == \"architecture-report-$SOURCE_ATTEMPT\" and .expired == false) | .id")
          if [[ -z "$artifact" ]]; then
            modern=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT/jobs" \
              --paginate --slurp | jq 'map(.jobs) | add | any(.name == "Architecture review report")')
            if [[ "$modern" == true ]]; then
              echo "Report job exists but its attempt artifact is absent or expired" >&2
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No architecture report was produced by development run $SOURCE_RUN/$SOURCE_ATTEMPT." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$artifact" =~ ^[0-9]+$ ]] || { echo "Expected exactly one report artifact for this attempt"; exit 1; }
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/report.zip"
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN" \
            | jq --arg repository "$REPOSITORY" '{repository: {full_name: $repository}, workflow_run: .}' \
            > "$RUNNER_TEMP/source-event.json"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build current architecture page
        if: steps.evidence.outputs.available == 'true'
        run: |
          python3 script/architecture_study/publish_reports.py \
            --event "$RUNNER_TEMP/source-event.json" --archive "$RUNNER_TEMP/report.zip" \
            --site "$RUNNER_TEMP/architecture-pages"

      - name: Upload current architecture page
        if: steps.evidence.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/architecture-pages

  deploy:
    needs: publish
    if: needs.publish.outputs.available == 'true'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current architecture
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link the current architecture
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Current development architecture: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
