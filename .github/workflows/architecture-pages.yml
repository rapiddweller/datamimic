name: Publish architecture reviews

on:
  workflow_run:
    workflows: [Github Datamimic CE CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: architecture-pages
  queue: max
  cancel-in-progress: false

jobs:
  archive:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    outputs:
      available: ${{ steps.evidence.outputs.available }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download this attempt's report data
        id: evidence
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          artifact=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --paginate \
            --jq ".artifacts[] | select(.name == \"architecture-report-$SOURCE_ATTEMPT\" and .expired == false) | .id")
          if [[ -z "$artifact" ]]; then
            modern=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT/jobs" \
              --paginate --slurp --jq 'map(.jobs) | add | any(.name == "Architecture review report")')
            if [[ "$modern" == true ]]; then
              echo "Report job exists but its attempt artifact is absent or expired" >&2
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Not published: the report job did not run in source attempt $SOURCE_RUN/$SOURCE_ATTEMPT (legacy workflow or partial rerun)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$artifact" =~ ^[0-9]+$ ]] || { echo "Expected exactly one report artifact for this attempt"; exit 1; }
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/report.zip"
          gh api "repos/$REPOSITORY/commits/$SOURCE_SHA/pulls" --paginate --slurp \
            --jq 'add' > "$RUNNER_TEMP/prs.json"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Restore persistent report history
        if: steps.evidence.outputs.available == 'true'
        run: |
          SITE="$RUNNER_TEMP/architecture-site"
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          existing=$(git ls-remote origin refs/heads/architecture-reports)
          if [[ -n "$existing" ]]; then
            git fetch origin refs/heads/architecture-reports
            git worktree add --detach "$SITE" FETCH_HEAD
          else
            tree=$(git hash-object -w -t tree /dev/null)
            commit=$(git commit-tree "$tree" -m "Initialize architecture report archive")
            git worktree add --detach "$SITE" "$commit"
          fi

      - name: Validate and append report (data only)
        if: steps.evidence.outputs.available == 'true'
        run: |
          python3 script/architecture_study/publish_reports.py \
            --event "$GITHUB_EVENT_PATH" --archive "$RUNNER_TEMP/report.zip" \
            --site "$SITE" --prs "$RUNNER_TEMP/prs.json"
          git -C "$SITE" add --all
          if ! git -C "$SITE" diff --cached --quiet; then
            git -C "$SITE" commit -m "Archive architecture review $SOURCE_RUN/$SOURCE_ATTEMPT"
            git -C "$SITE" push origin HEAD:refs/heads/architecture-reports
          fi

      - name: Upload complete Pages site
        if: steps.evidence.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/architecture-site

  deploy:
    needs: archive
    if: needs.archive.outputs.available == 'true'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reports
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link the published review
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "Architecture review: ${PAGE_URL}runs/$SOURCE_RUN/$SOURCE_ATTEMPT/" >> "$GITHUB_STEP_SUMMARY"
